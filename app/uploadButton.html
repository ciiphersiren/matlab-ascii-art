<!DOCTYPE html>
<!--
"Upload from Computer" button for AsciiArtApp, shown in a uihtml component.

Opens the browser's file picker, so it can read files from the user's own
computer (uigetfile in MATLAB Online only sees MATLAB Drive). The file is
read as a data URL and sent to MATLAB with one of these events:

ImageUploaded  {name, data, resized}
data    = "data:<type>;base64,..."
resized = true:  the browser decoded the image, scaled it so the
longest side is at most MAX_SIZE pixels, and
re-encoded it as PNG
false: the browser could not decode it, so data holds
the original file bytes for MATLAB's imread
UploadFailed   {name}   the file could not be read at all

Blob URLs (URL.createObjectURL) are not used because the uihtml sandbox
can block them. MAX_SIZE matches AsciiArtApp.MaxWorkingSize.
-->
<html>
    <head>
        <meta charset="utf-8">
        <style>
        html, body { margin: 0; height: 100%; background: transparent; }
        label {
        display: flex; align-items: center; justify-content: center;
        height: 100%; box-sizing: border-box;
        font: 12px Helvetica, Arial, sans-serif; color: #212121;
        background: #f7f7f7; border: 1px solid #a0a0a0; border-radius: 4px;
        cursor: pointer; user-select: none;
        }
        label:hover { background: #e9e9e9; }
        input { display: none; }
        </style>
        <script>
        const MAX_SIZE = 1200;

        function setup(htmlComponent) {
        const input = document.getElementById("file");

        function send(name, data, resized) {
        input.value = "";   // so choosing the same file again still fires
        htmlComponent.sendEventToMATLAB("ImageUploaded",
        { name: name, data: data, resized: resized });
        }

        input.addEventListener("change", function () {
        const file = input.files[0];
        if (!file) {
        return;
        }

        const reader = new FileReader();
        reader.onerror = function () {
        input.value = "";
        htmlComponent.sendEventToMATLAB("UploadFailed", { name: file.name });
        };
        reader.onload = function () {
        const original = reader.result;
        const img = new Image();

        img.onload = function () {
        try {
        const scale = Math.min(1, MAX_SIZE / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";   // transparent areas become white, not black
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        send(file.name, canvas.toDataURL("image/png"), true);
        } catch (err) {
        send(file.name, original, false);
        }
        };
        // The browser cannot decode it: let MATLAB try the original bytes
        img.onerror = function () {
        send(file.name, original, false);
        };

        img.src = original;
        };
        reader.readAsDataURL(file);
        });
        }
        </script>
    </head>
    <body>
        <label for="file">Upload from Computer</label>
        <input type="file" id="file" accept="image/*">
    </body>
</html>
