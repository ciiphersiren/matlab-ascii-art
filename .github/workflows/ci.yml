name: MATLAB Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      # Report both releases even if one fails
      fail-fast: false
      matrix:
        release: [R2023a, latest]   # R2023a is the minimum stated in the README

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MATLAB ${{ matrix.release }}
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}

      # run-command starts MATLAB with -batch, so the error thrown by
      # assertSuccess in runAllTests fails this step and the build
      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("tests"); runAllTests

      # Upload even when tests fail, since the report is still written
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.release }}
          path: coverage/
          if-no-files-found: warn
